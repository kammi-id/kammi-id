services:
  db:
    container_name: db
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_PASSWORD: db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql

  # Basis data milik `bun test` sendiri. Sembilan berkas tes menjalankan
  # TRUNCATE di tiap `beforeEach`, jadi ia harus hidup di mesin yang menjalankan
  # tesnya — bukan berbagi dengan `db`, dan bukan lewat jaringan.
  #
  # Sengaja tanpa volume: isinya residu tes, dan tidak ada yang perlu selamat
  # dari `docker compose down`.
  db-test:
    container_name: db-test
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_PASSWORD: db
      POSTGRES_DB: kammi_test
    ports:
      - '5434:5432'

  adminer:
    container_name: adminer
    image: adminer:latest
    ports:
      - '5433:8080'

volumes:
  db_data:
