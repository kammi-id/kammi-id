name: CI

# Required secret: CI_HEALTH_TOKEN — set in GitHub repo Settings > Secrets > Actions

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev-*]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kammi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kammi_test

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fix Formatting
        run: bun run format

      - name: Fix Linting
        run: bun run lint:fix

      - name: Commit auto-fixes
        run: |
          git config user.email "ci@kammi.id"
          git config user.name "KAMMI CI"
          git diff --quiet && git diff --cached --quiet || \
            (git commit -am "style: auto-fix formatting and linting [skip ci]" && git push)

      - name: Check Types
        run: bun run check:types

      - name: Set up database functions
        run: |
          psql $DATABASE_URL -c "
            CREATE OR REPLACE FUNCTION uuidv7() RETURNS uuid AS \$\$
              SELECT encode(
                set_bit(set_bit(
                  overlay(uuid_send(gen_random_uuid())
                    placing substring(int8send((extract(epoch from clock_timestamp())*1000)::bigint) from 3)
                    from 1 for 6),
                  52, 1), 53, 1),
                'hex')::uuid;
            \$\$ LANGUAGE sql VOLATILE;"

      - name: Run DB Migrations
        run: bun run db:migrate

      - name: Run Unit & Integration Tests
        run: bun test

      - name: Run Component Tests
        run: bun run test:ct

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          bun run dev &
          npx wait-on http://localhost:3000
          bun run test:e2e

  docker:
    needs: [test]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=dev-,enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Smoke Test
        env:
          CI_HEALTH_TOKEN: ${{ secrets.CI_HEALTH_TOKEN }}
        run: bun run test:smoke
