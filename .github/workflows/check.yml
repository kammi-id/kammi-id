name: Check

on:
  push:
  pull_request:

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
      message: ${{ steps.result.outputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        id: lint
        run: |
          set +e
          OUTPUT=$(bun run check:lint 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          set -e

          # Write to output for later use
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
            echo "exit_code=$EXIT_CODE"
          } >> "$GITHUB_OUTPUT"

          # Write GitHub annotations for each error line
          if [ $EXIT_CODE -ne 0 ]; then
            while IFS= read -r line; do
              # ESLint format: /path/to/file.ts:line:col: message
              if echo "$line" | grep -qE "^/.+:[0-9]+:[0-9]+:"; then
                FILE=$(echo "$line" | cut -d: -f1)
                LINE_NUM=$(echo "$line" | cut -d: -f2)
                COL=$(echo "$line" | cut -d: -f3)
                MSG=$(echo "$line" | cut -d: -f4- | sed 's/^ *//')
                echo "::error file=${FILE},line=${LINE_NUM},col=${COL}::${MSG}"
              fi
            done <<< "$OUTPUT"
          fi

          exit $EXIT_CODE
        continue-on-error: true

      - name: Set result
        id: result
        run: |
          if [ "${{ steps.lint.outputs.exit_code }}" = "0" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "message=" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            {
              echo "message<<EOF"
              echo "${{ steps.lint.outputs.output }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if lint errors
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1

  # ─── Format ──────────────────────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
      message: ${{ steps.result.outputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run format check
        id: format
        run: |
          set +e
          OUTPUT=$(bun run check:format 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          set -e

          # Write to output for later use
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
            echo "exit_code=$EXIT_CODE"
          } >> "$GITHUB_OUTPUT"

          # Write GitHub annotations for each unformatted file
          if [ $EXIT_CODE -ne 0 ]; then
            while IFS= read -r line; do
              # Prettier lists unformatted files as: [warn] path/to/file.ts
              if echo "$line" | grep -qE "^\[warn\]"; then
                FILE=$(echo "$line" | sed 's/\[warn\] //')
                echo "::error file=${FILE}::File is not formatted. Run \`bun run format\` to fix."
              fi
            done <<< "$OUTPUT"
          fi

          exit $EXIT_CODE
        continue-on-error: true

      - name: Set result
        id: result
        run: |
          if [ "${{ steps.format.outputs.exit_code }}" = "0" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "message=" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            {
              echo "message<<EOF"
              echo "${{ steps.format.outputs.output }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if format errors
        if: steps.format.outputs.exit_code != '0'
        run: exit 1

  # ─── PR Comment ──────────────────────────────────────────────────────────────
  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [lint, format]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const lintStatus   = '${{ needs.lint.outputs.status }}'
            const formatStatus = '${{ needs.format.outputs.status }}'
            const lintMsg      = `${{ needs.lint.outputs.message }}`
            const formatMsg    = `${{ needs.format.outputs.message }}`

            const icon  = (s) => s === 'success' ? '✅' : '❌'
            const label = (s) => s === 'success' ? 'Passed' : 'Failed'

            let body = `<!-- check-workflow-comment -->
            ## Check Results

            | Job | Status |
            |-----|--------|
            | Lint | ${icon(lintStatus)} ${label(lintStatus)} |
            | Format | ${icon(formatStatus)} ${label(formatStatus)} |
            `

            if (lintStatus !== 'success' && lintMsg.trim()) {
              body += `\n### Lint Errors\n\`\`\`\n${lintMsg.trim()}\n\`\`\`\n`
            }

            if (formatStatus !== 'success' && formatMsg.trim()) {
              body += `\n### Format Errors\n\`\`\`\n${formatMsg.trim()}\n\`\`\`\n`
            }

            const marker = '<!-- check-workflow-comment -->'
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existing = comments.find((c) => c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
